# Canonical copy. scripts/github-test.ps1 syncs it to .github/workflows/windows-tests.yml
# on main of the build-only repo peterqifei/petergram-desktop-ci (D83, D94); this tree
# itself never carries .github. The runner fetches the exact commit from public GitLab
# and runs only entrypoints that exist on that commit: pytest, scripts/test-cpp-logic.ps1,
# scripts/source_tree.py and scripts/resolve-toolchain.ps1. Nothing here is read from
# ci/github-build/windows/, so a commit older than this file can be tested.
#
# The suite is what GitLab Linux CI cannot run: the Windows branches of the Python tests,
# the windows-only and source-root C++ manifest entries, the restart matrix and the Inno
# Setup probe. It replaces the full runs that used to load local developer machines (D94).
#
# Three jobs run in parallel: `pytest`, `cpp-logic`, and `seam-preflight`.
# `pytest` and `cpp-logic` use no secrets and no cache step.
# `seam-preflight` restores the existing `pg-win2025d-*` dependency caches read-only via
# `actions/cache/restore` (never calls `save`, zero shared 10 GB cache quota impact) to run
# `configure-test.ps1` (`TDESKTOP_API_TEST=ON`), build only the minimal codegen header
# targets, and check all gated `overlay/denia/` translation units with `cl /Zs` (no `.obj`).
# Sources for `pytest` and `cpp-logic` live at D:\petergram and D:\src (no links under
# them: source_tree.py refuses links); temp files go to D: too, C: is small. The root must
# be at least 8 characters: scripts/release_identity.py ignores a shorter repo root when it
# scans a dist for an owner workdir path, so with D:\pg
# test_portable_build_txt_with_repo_root_is_refused saw no leak (first run, 45745760812).
# `seam-preflight` uses D:\pg (matching `windows.yml` cache keys) and does not run
# `release_identity.py`.
#
# Not covered (docs/ci.md, "Windows test run"): tests/test_active_migrated_history.py,
# tests/test_agent_pipe.py, tests/translate_protocol_test.py and
# tests/update_protocol_test.py need a configured Qt build, which the runner's trimmed
# library cache does not give; they are left out, not wired to turn a missing Qt into a
# green result, and can still be run locally where a Qt build exists. The test that reads
# out-test/Telegram.vcxproj skips without a configured test build, and the manifest entries
# denia_filter_rule_test (Qt Core) and denia_archive_cause_debug_test (needs
# CL=/MDd /D_DEBUG) print an explicit skip.
name: windows-tests
run-name: windows-tests ${{ inputs.request_id }} ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-hex Petergram commit on gitlab.com
        required: true
        type: string
      request_id:
        description: Caller request id, matched in the run title
        required: true
        type: string

permissions:
  contents: read

# Own group, never the build's windows-<sha>: a test run must not queue behind a Release build.
concurrency:
  group: windows-tests-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  SOURCE_URL: https://gitlab.com/my-denia-group/Petergram.git
  SOURCE_SHA: ${{ inputs.source_sha }}
  REQUEST_ID: ${{ inputs.request_id }}
  PG_ROOT: D:\petergram
  PG_SRC: D:\src
  OUT_DIR: D:\out
  GIT_AUTHOR_NAME: petergram-ci
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: petergram-ci
  GIT_COMMITTER_EMAIL: ci@example.invalid
  PYTHONUNBUFFERED: "1"
  # The runner's code page is cp1252; the repo's scripts and tests read and write UTF-8 text.
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

defaults:
  run:
    shell: pwsh

jobs:
  pytest:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Fetch exact source from GitLab
        id: fetch
        run: |
          if ($env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'source_sha must be 40 lowercase hex' }
          if ($env:REQUEST_ID -cnotmatch '^[A-Za-z0-9._-]{1,80}$') { throw 'request_id must match [A-Za-z0-9._-]{1,80}' }
          New-Item -ItemType Directory -Force -Path $env:OUT_DIR, 'D:\tmp' | Out-Null
          "TEMP=D:\tmp", "TMP=D:\tmp" | Add-Content -LiteralPath $env:GITHUB_ENV
          # Local Windows checkouts keep core.symlinks=false; tests that build fixture repos need the same.
          git config --global core.symlinks false; if ($LASTEXITCODE) { exit 1 }
          Write-Output "autocrlf=$(git config --show-scope --get core.autocrlf) symlinks=$(git config --show-scope --get core.symlinks)"
          git init --quiet $env:PG_ROOT; if ($LASTEXITCODE) { exit 1 }
          git -C $env:PG_ROOT remote add origin $env:SOURCE_URL; if ($LASTEXITCODE) { exit 1 }
          git -C $env:PG_ROOT fetch --quiet --depth=1 origin $env:SOURCE_SHA; if ($LASTEXITCODE) { exit 1 }
          git -C $env:PG_ROOT checkout --quiet --detach FETCH_HEAD; if ($LASTEXITCODE) { exit 1 }
          $head = git -C $env:PG_ROOT rev-parse HEAD
          if ($head -cne $env:SOURCE_SHA) { throw "fetched $head, expected $env:SOURCE_SHA" }
          Write-Output "source_sha=$head"
      - name: Python 3.13 (as .gitlab-ci.yml)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python --version
          python -m pip install --quiet --disable-pip-version-check pytest cryptography pyyaml
          if ($LASTEXITCODE) { exit 1 }
          python -m pytest --version
      - name: Source-only upstream tree (for the vendor-mode contracts)
        id: tree
        working-directory: D:\petergram
        run: |
          $t0 = Get-Date
          python scripts\source_tree.py --root $env:PG_ROOT --vendor $env:PG_SRC --source-only bootstrap
          $code = $LASTEXITCODE
          "source_tree_bootstrap $([int]((Get-Date) - $t0).TotalSeconds)" | Add-Content -LiteralPath "$env:OUT_DIR\timings.txt"
          exit $code
      # Everything `python -m pytest tests` collects on Windows, with the same tool and stub
      # ignores as .gitlab-ci.yml overlay-tests and none of its Windows exclusions: the four
      # source-rebuild suites run here, and the Windows, pwsh and Inno branches do not skip.
      # Ignored: the two source-root C++ generators (the manifest runs them),
      # test_text_eradication.py (a tool that needs a store), test_text_restart_matrix.py
      # (the cpp-logic job drives it after the child exe exists),
      # test_installer_profile_detect.py (its own step below), and the four Qt probe tests
      # (not covered, see the header).
      - name: pytest tests
        id: pytest
        if: ${{ !cancelled() && steps.tree.conclusion == 'success' }}
        timeout-minutes: 70
        working-directory: D:\petergram
        env:
          PETERGRAM_VENDOR: D:\src
        run: |
          $t0 = Get-Date
          $pytestArgs = @(
            'tests', '-q', '-rs', '--tb=short', '--durations=15', '-p', 'no:cacheprovider',
            '--basetemp', 'D:\pt', '--junitxml', "$env:OUT_DIR\pytest.xml",
            '--ignore=tests/test_installer_profile_detect.py',
            '--ignore=tests/test_text_eradication.py',
            '--ignore=tests/test_text_restart_matrix.py',
            '--ignore=tests/test_stories_mark_read.py',
            '--ignore=tests/test_translate_provider_cache.py',
            '--ignore=tests/test_active_migrated_history.py',
            '--ignore=tests/test_agent_pipe.py',
            '--ignore=tests/translate_protocol_test.py',
            '--ignore=tests/update_protocol_test.py'
          )
          python -m pytest @pytestArgs 2>&1 | Tee-Object -FilePath "$env:OUT_DIR\pytest.log"
          $code = $LASTEXITCODE
          "pytest $([int]((Get-Date) - $t0).TotalSeconds)" | Add-Content -LiteralPath "$env:OUT_DIR\timings.txt"
          exit $code
      - name: Inno Setup probe (must run, not skip)
        id: installer
        if: ${{ !cancelled() && steps.tree.conclusion == 'success' }}
        timeout-minutes: 20
        working-directory: D:\petergram
        run: |
          $t0 = Get-Date
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup 6 ISCC.exe is not on this image ($iscc); the installer test would skip" }
          $env:PETTERGRAM_ISCC = $iscc
          python -m pytest tests/test_installer_profile_detect.py -q -rs --tb=short --durations=5 -p no:cacheprovider --basetemp D:\pt-iss --junitxml "$env:OUT_DIR\installer.xml"
          $code = $LASTEXITCODE
          "installer $([int]((Get-Date) - $t0).TotalSeconds)" | Add-Content -LiteralPath "$env:OUT_DIR\timings.txt"
          if ($code -eq 0) {
            $x = [xml](Get-Content -LiteralPath "$env:OUT_DIR\installer.xml" -Raw)
            $n = $x.SelectNodes('//testcase').Count
            $s = $x.SelectNodes('//testcase[skipped]').Count
            if ($n -eq 0 -or $s -gt 0) { throw "installer probe ran $n tests with $s skipped" }
          }
          exit $code
      - name: Fail on a skipped Windows test
        id: skips
        if: ${{ !cancelled() && steps.pytest.conclusion != 'skipped' }}
        run: |
          # A Windows, pwsh, PowerShell or Inno skip means the test did not run where it must.
          $bad = @()
          foreach ($f in 'pytest.xml', 'installer.xml') {
            $p = Join-Path $env:OUT_DIR $f
            if (-not (Test-Path -LiteralPath $p)) { continue }
            $x = [xml](Get-Content -LiteralPath $p -Raw)
            foreach ($c in $x.SelectNodes('//testcase[skipped]')) {
              if ([string]$c.skipped.message -match 'Windows|pwsh|PowerShell|Inno|ISCC') {
                $bad += "$($c.classname)::$($c.name): $($c.skipped.message)"
              }
            }
          }
          if ($bad.Count) { $bad | ForEach-Object { Write-Output "windows_skip=$_" }; throw "$($bad.Count) Windows test(s) skipped" }
          Write-Output 'windows_skips=none'
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          function Add-Summary([string]$Line) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $Line; Write-Output "summary: $Line" }
          Add-Summary "## windows-tests pytest job, $($env:SOURCE_SHA.Substring(0, 12))"
          $plog = Join-Path $env:OUT_DIR 'pytest.log'
          if (Test-Path -LiteralPath $plog) { Add-Summary "- pytest tests: $(Get-Content -LiteralPath $plog -Tail 1)" }
          foreach ($f in 'pytest.xml', 'installer.xml') {
            $p = Join-Path $env:OUT_DIR $f
            if (-not (Test-Path -LiteralPath $p)) { Add-Summary "- $f : no report"; continue }
            $x = [xml](Get-Content -LiteralPath $p -Raw)
            $failed = @($x.SelectNodes('//testcase[failure]'))
            $errors = @($x.SelectNodes('//testcase[error]'))
            $skipped = @($x.SelectNodes('//testcase[skipped]'))
            Add-Summary ("- $f : {0} failed, {1} errors, {2} skipped" -f $failed.Count, $errors.Count, $skipped.Count)
            foreach ($c in ($failed + $errors)) { Add-Summary "  - $($c.classname)::$($c.name)" }
            foreach ($g in ($skipped | Group-Object { [string]$_.skipped.message } | Sort-Object Count -Descending)) {
              Add-Summary ("  - skipped {0}: {1}" -f $g.Count, $g.Name)
            }
          }
          $timings = Join-Path $env:OUT_DIR 'timings.txt'
          if (Test-Path -LiteralPath $timings) {
            Add-Summary 'Step durations (seconds):'
            Get-Content -LiteralPath $timings | ForEach-Object { Add-Summary "- $_" }
          }
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-tests-pytest-${{ inputs.source_sha }}
          path: D:\out
          if-no-files-found: warn
          retention-days: 3

  cpp-logic:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Fetch exact source from GitLab
        id: fetch
        run: |
          if ($env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'source_sha must be 40 lowercase hex' }
          if ($env:REQUEST_ID -cnotmatch '^[A-Za-z0-9._-]{1,80}$') { throw 'request_id must match [A-Za-z0-9._-]{1,80}' }
          New-Item -ItemType Directory -Force -Path $env:OUT_DIR, 'D:\tmp' | Out-Null
          "TEMP=D:\tmp", "TMP=D:\tmp" | Add-Content -LiteralPath $env:GITHUB_ENV
          git config --global core.symlinks false; if ($LASTEXITCODE) { exit 1 }
          Write-Output "autocrlf=$(git config --show-scope --get core.autocrlf) symlinks=$(git config --show-scope --get core.symlinks)"
          git init --quiet $env:PG_ROOT; if ($LASTEXITCODE) { exit 1 }
          git -C $env:PG_ROOT remote add origin $env:SOURCE_URL; if ($LASTEXITCODE) { exit 1 }
          git -C $env:PG_ROOT fetch --quiet --depth=1 origin $env:SOURCE_SHA; if ($LASTEXITCODE) { exit 1 }
          git -C $env:PG_ROOT checkout --quiet --detach FETCH_HEAD; if ($LASTEXITCODE) { exit 1 }
          $head = git -C $env:PG_ROOT rev-parse HEAD
          if ($head -cne $env:SOURCE_SHA) { throw "fetched $head, expected $env:SOURCE_SHA" }
          Write-Output "source_sha=$head"
      - name: Python 3.13 (as .gitlab-ci.yml)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Source-only upstream tree (the source_root manifest entries)
        id: tree
        working-directory: D:\petergram
        run: |
          $t0 = Get-Date
          python --version
          python scripts\source_tree.py --root $env:PG_ROOT --vendor $env:PG_SRC --source-only bootstrap
          $code = $LASTEXITCODE
          "source_tree_bootstrap $([int]((Get-Date) - $t0).TotalSeconds)" | Add-Content -LiteralPath "$env:OUT_DIR\timings.txt"
          exit $code
      - name: Toolchain
        working-directory: D:\petergram
        run: |
          Write-Output "image=$($env:ImageOS) $($env:ImageVersion)"
          Write-Output "cpu_logical=$([Environment]::ProcessorCount)"
          Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Used -ne $null } | ForEach-Object {
            Write-Output ('disk {0}: free_gb={1:N1}' -f $_.Name, ($_.Free / 1GB))
          }
          . .\scripts\resolve-toolchain.ps1
          $tc = Resolve-DeniaToolchain
          Write-Output "vcvars_ver=$($tc.VcvarsVer) windows_sdk=$($tc.WinSdk) present=$($tc.WinSdkOk)"
          $banner = & cmd.exe /d /c "call `"$($tc.Vcvars)`" -vcvars_ver=$($tc.VcvarsVer) >nul && cl 2>&1"
          Write-Output "cl=$(($banner | Select-String 'Version' | Select-Object -First 1).Line.Trim())"
      # The full manifest through the MSVC front: the platform=all entries, the windows-only
      # entries (archive suites, secure store, file cipher, text restart child, ...) and the
      # source_root entries against the source-only tree. cpp_logic_tests must end `ok`:
      # `partial` means a source_root entry was skipped.
      - name: Standalone C++ logic tests (full manifest)
        id: cpp
        if: ${{ !cancelled() && steps.tree.conclusion == 'success' }}
        timeout-minutes: 60
        working-directory: D:\petergram
        run: |
          $t0 = Get-Date
          pwsh -NoProfile -File scripts\test-cpp-logic.ps1 -SourceRoot $env:PG_SRC 2>&1 | Tee-Object -FilePath "$env:OUT_DIR\cpp-logic.log"
          $code = $LASTEXITCODE
          "cpp_logic $([int]((Get-Date) - $t0).TotalSeconds)" | Add-Content -LiteralPath "$env:OUT_DIR\timings.txt"
          if ($code -eq 0 -and -not (Select-String -LiteralPath "$env:OUT_DIR\cpp-logic.log" -Pattern '^cpp_logic_tests=ok$' -Quiet)) {
            throw 'cpp_logic_tests=ok was not printed (partial or missing)'
          }
          exit $code
      - name: Text restart matrix (needs the child exe the step above built)
        id: matrix
        if: ${{ !cancelled() && steps.tree.conclusion == 'success' }}
        timeout-minutes: 30
        working-directory: D:\petergram
        run: |
          $t0 = Get-Date
          $exe = Join-Path $env:PG_ROOT 'artifacts\cpp-logic\denia_text_restart_child_test.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "child exe missing ($exe): the C++ logic step did not build it" }
          python tests\test_text_restart_matrix.py --cycles 20 --with-negative-controls --artifacts "$env:OUT_DIR\matrix" 2>&1 | Tee-Object -FilePath "$env:OUT_DIR\matrix.log"
          $code = $LASTEXITCODE
          "restart_matrix $([int]((Get-Date) - $t0).TotalSeconds)" | Add-Content -LiteralPath "$env:OUT_DIR\timings.txt"
          exit $code
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          function Add-Summary([string]$Line) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $Line; Write-Output "summary: $Line" }
          Add-Summary "## windows-tests cpp-logic job, $($env:SOURCE_SHA.Substring(0, 12))"
          $log = Join-Path $env:OUT_DIR 'cpp-logic.log'
          if (Test-Path -LiteralPath $log) {
            $lines = Get-Content -LiteralPath $log
            $compiled = @($lines | Where-Object { $_ -match '^compile=' }).Count
            $skips = @($lines | Where-Object { $_ -match '^skip=' })
            $gen = @($lines | Where-Object { $_ -match '^generate=' }).Count
            Add-Summary "- C++ logic: $compiled compiled, $gen generated, $($skips.Count) skipped, result $(($lines | Where-Object { $_ -match '^cpp_logic_tests=' }) -join ',')"
            $skips | ForEach-Object { Add-Summary "  - $_" }
          } else {
            Add-Summary '- C++ logic: no log'
          }
          $matrix = Join-Path $env:OUT_DIR 'matrix.log'
          if (Test-Path -LiteralPath $matrix) { Add-Summary "- restart matrix: $(Get-Content -LiteralPath $matrix -Tail 1)" } else { Add-Summary '- restart matrix: no log' }
          $timings = Join-Path $env:OUT_DIR 'timings.txt'
          if (Test-Path -LiteralPath $timings) {
            Add-Summary 'Step durations (seconds):'
            Get-Content -LiteralPath $timings | ForEach-Object { Add-Summary "- $_" }
          }
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-tests-cpp-${{ inputs.source_sha }}
          path: |
            D:\out\*.log
            D:\out\timings.txt
          if-no-files-found: warn
          retention-days: 3

  seam-preflight:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PG_ROOT: D:\pg
    steps:
      - name: Fetch exact source from GitLab
        id: fetch
        run: |
          if ($env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'source_sha must be 40 lowercase hex' }
          if ($env:REQUEST_ID -cnotmatch '^[A-Za-z0-9._-]{1,80}$') { throw 'request_id must match [A-Za-z0-9._-]{1,80}' }
          New-Item -ItemType Directory -Force -Path $env:OUT_DIR, 'D:\tmp' | Out-Null
          "TEMP=D:\tmp", "TMP=D:\tmp" | Add-Content -LiteralPath $env:GITHUB_ENV
          git config --global core.symlinks false; if ($LASTEXITCODE) { exit 1 }
          git init --quiet $env:PG_ROOT; if ($LASTEXITCODE) { exit 1 }
          git -C $env:PG_ROOT remote add origin $env:SOURCE_URL; if ($LASTEXITCODE) { exit 1 }
          git -C $env:PG_ROOT fetch --quiet --depth=1 origin $env:SOURCE_SHA; if ($LASTEXITCODE) { exit 1 }
          git -C $env:PG_ROOT checkout --quiet --detach FETCH_HEAD; if ($LASTEXITCODE) { exit 1 }
          $head = git -C $env:PG_ROOT rev-parse HEAD
          if ($head -cne $env:SOURCE_SHA) { throw "fetched $head, expected $env:SOURCE_SHA" }
          $link = Join-Path $env:GITHUB_WORKSPACE 'pg'
          New-Item -ItemType SymbolicLink -Path $link -Target $env:PG_ROOT | Out-Null
          "CACHE_LIBS=$link\vendor\Libraries\win64" | Add-Content -LiteralPath $env:GITHUB_ENV
          "CACHE_THIRDPARTY=$link\vendor\ThirdParty" | Add-Content -LiteralPath $env:GITHUB_ENV
          Write-Output "source_sha=$head"
      - name: Check seam preflight script availability
        id: script_check
        run: |
          $hasScript = Test-Path -LiteralPath (Join-Path $env:PG_ROOT 'scripts\preflight-api-test-seams.ps1') -PathType Leaf
          "available=$($hasScript.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          if (-not $hasScript) {
            $reason = "missing scripts/preflight-api-test-seams.ps1 at $($env:SOURCE_SHA.Substring(0, 12))"
            "skip_reason=$reason" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
            Write-Output "seam_preflight=skipped reason=$reason"
          } else {
            Write-Output 'seam_preflight_script=present'
          }
      - name: Python 3.13 (as .gitlab-ci.yml)
        if: ${{ steps.script_check.outputs.available == 'true' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Bootstrap vendor source
        id: tree
        if: ${{ steps.script_check.outputs.available == 'true' }}
        working-directory: D:\pg
        run: |
          $t0 = Get-Date
          if (Get-Command nuget -ErrorAction SilentlyContinue) {
            & nuget sources Disable -Name 'Microsoft Visual Studio Offline Packages' 2>&1 | Out-Null
            & nuget sources Add -Source 'https://api.nuget.org/v3/index.json' 2>&1 | Out-Null
          }
          $global:LASTEXITCODE = 0
          python scripts\source_tree.py bootstrap --root $env:PG_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\source_tree.py verify --root $env:PG_ROOT --require-submodules | Out-Null
          $code = $LASTEXITCODE
          "source_tree_bootstrap $([int]((Get-Date) - $t0).TotalSeconds)" | Add-Content -LiteralPath "$env:OUT_DIR\timings.txt"
          exit $code
      - name: Restore ThirdParty (read-only)
        id: tp
        if: ${{ steps.script_check.outputs.available == 'true' && steps.tree.conclusion == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_THIRDPARTY }}
          key: pg-win2025d-tp-v1-none
          restore-keys: pg-win2025d-tp-v1-
      - name: Restore Libraries (read-only)
        id: libs
        if: ${{ steps.script_check.outputs.available == 'true' && steps.tree.conclusion == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CACHE_LIBS }}\*
            !${{ env.CACHE_LIBS }}\cache_keys
            !${{ env.CACHE_LIBS }}\[qQ]t[_-]*
            ${{ env.CACHE_LIBS }}\cache_keys\*
            !${{ env.CACHE_LIBS }}\cache_keys\[qQ]t[_-]*
          key: pg-win2025d-libs-v4-none
          restore-keys: pg-win2025d-libs-v4-
      - name: Restore Qt (read-only)
        id: qt
        if: ${{ steps.script_check.outputs.available == 'true' && steps.tree.conclusion == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CACHE_LIBS }}\[qQ]t[_-]*
            ${{ env.CACHE_LIBS }}\cache_keys\[qQ]t[_-]*
          key: pg-win2025d-qt-v3-none
          restore-keys: pg-win2025d-qt-v3-
      - name: Verify restored dependency caches
        id: caches
        if: ${{ steps.script_check.outputs.available == 'true' && steps.tree.conclusion == 'success' }}
        working-directory: D:\pg
        env:
          MATCHED_TP: ${{ steps.tp.outputs.cache-matched-key }}
          MATCHED_LIBS: ${{ steps.libs.outputs.cache-matched-key }}
          MATCHED_QT: ${{ steps.qt.outputs.cache-matched-key }}
        run: |
          if (-not $env:MATCHED_TP -or -not $env:MATCHED_LIBS -or -not $env:MATCHED_QT) {
            $reason = "dependency cache miss (tp='$env:MATCHED_TP', libs='$env:MATCHED_LIBS', qt='$env:MATCHED_QT')"
            "ready=false" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
            "skip_reason=$reason" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
            Write-Output "seam_preflight=skipped reason=$reason"
            exit 0
          }
          . .\scripts\resolve-toolchain.ps1
          $qtPrefix = Get-DeniaQtPrefix -Root $env:PG_ROOT
          if (-not $qtPrefix) {
            $reason = "qt prefix missing after cache restore under $env:PG_ROOT\vendor\Libraries\win64"
            "ready=false" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
            "skip_reason=$reason" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
            Write-Output "seam_preflight=skipped reason=$reason"
            exit 0
          }
          "ready=true" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          Write-Output "restored_tp=$env:MATCHED_TP"
          Write-Output "restored_libs=$env:MATCHED_LIBS"
          Write-Output "restored_qt=$env:MATCHED_QT"
          Write-Output "qt_prefix=$qtPrefix"
      - name: Configure test build (TDESKTOP_API_TEST=ON)
        id: configure
        if: ${{ !cancelled() && steps.caches.outputs.ready == 'true' }}
        timeout-minutes: 15
        working-directory: D:\pg
        run: |
          $t0 = Get-Date
          pwsh -NoProfile -File scripts\configure-test.ps1 2>&1 | Tee-Object -FilePath "$env:OUT_DIR\configure-test.log"
          $code = $LASTEXITCODE
          "configure_test $([int]((Get-Date) - $t0).TotalSeconds)" | Add-Content -LiteralPath "$env:OUT_DIR\timings.txt"
          exit $code
      - name: Preflight API-test and memory-report seams
        id: preflight
        if: ${{ !cancelled() && steps.configure.conclusion == 'success' }}
        timeout-minutes: 30
        working-directory: D:\pg
        run: |
          $t0 = Get-Date
          pwsh -NoProfile -File scripts\preflight-api-test-seams.ps1 2>&1 | Tee-Object -FilePath "$env:OUT_DIR\seam-preflight.log"
          $code = $LASTEXITCODE
          "seam_preflight $([int]((Get-Date) - $t0).TotalSeconds)" | Add-Content -LiteralPath "$env:OUT_DIR\timings.txt"
          exit $code
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          SCRIPT_AVAILABLE: ${{ steps.script_check.outputs.available }}
          SCRIPT_SKIP_REASON: ${{ steps.script_check.outputs.skip_reason }}
          CACHE_READY: ${{ steps.caches.outputs.ready }}
          CACHE_SKIP_REASON: ${{ steps.caches.outputs.skip_reason }}
        run: |
          function Add-Summary([string]$Line) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $Line; Write-Output "summary: $Line" }
          Add-Summary "## windows-tests seam-preflight job, $($env:SOURCE_SHA.Substring(0, 12))"
          if ($env:SCRIPT_AVAILABLE -ne 'true') {
            Add-Summary "seam-preflight: skipped (reason=$($env:SCRIPT_SKIP_REASON))"
          } elseif ($env:CACHE_READY -ne 'true') {
            Add-Summary "seam-preflight: skipped (reason=$($env:CACHE_SKIP_REASON))"
          } else {
            $log = Join-Path $env:OUT_DIR 'seam-preflight.log'
            if (Test-Path -LiteralPath $log) {
              $lines = Get-Content -LiteralPath $log
              foreach ($b in ($lines | Where-Object { $_ -match '^(?:batch=|seam_preflight=|codegen_seconds=)' })) {
                Add-Summary "- $b"
              }
            } else {
              Add-Summary '- seam-preflight: no log'
            }
          }
          $timings = Join-Path $env:OUT_DIR 'timings.txt'
          if (Test-Path -LiteralPath $timings) {
            Add-Summary 'Step durations (seconds):'
            Get-Content -LiteralPath $timings | ForEach-Object { Add-Summary "- $_" }
          }
      - name: Stage logs
        id: stage_logs
        if: ${{ !cancelled() }}
        run: |
          $stage = Join-Path $env:OUT_DIR 'seam-logs'
          $seamStage = Join-Path $stage 'api-test-seam-preflight'
          New-Item -ItemType Directory -Force -Path $stage, $seamStage | Out-Null
          if (Test-Path -LiteralPath $env:OUT_DIR) {
            Get-ChildItem -LiteralPath $env:OUT_DIR -Filter '*.log' -File -ErrorAction SilentlyContinue |
              Copy-Item -Destination $stage -Force
            $timings = Join-Path $env:OUT_DIR 'timings.txt'
            if (Test-Path -LiteralPath $timings -PathType Leaf) {
              Copy-Item -LiteralPath $timings -Destination $stage -Force
            }
          }
          $seamDir = Join-Path $env:PG_ROOT 'artifacts\api-test-seam-preflight'
          if (Test-Path -LiteralPath $seamDir -PathType Container) {
            Get-ChildItem -LiteralPath $seamDir -Filter '*.log' -File -ErrorAction SilentlyContinue |
              Copy-Item -Destination $seamStage -Force
          }
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-tests-seam-preflight-${{ inputs.source_sha }}
          path: D:\out\seam-logs
          if-no-files-found: warn
          retention-days: 3
