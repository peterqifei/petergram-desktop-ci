# Canonical copy of the macOS scaffold for peterqifei/petergram-desktop-ci (D83).
# The overlay has never been compiled for macOS (D3: mac stays unblocked but does
# not gate Windows), and parts of it are Windows-only, so this run is expected to
# stop at configure or compile; the failing step says so instead of pretending.
# Output when it does build: an unsigned development .app (TDESKTOP_API_TEST=ON,
# ad-hoc signature only), zipped. It needs no secrets.
name: macos
run-name: macos ${{ inputs.request_id }} ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-hex Petergram commit on gitlab.com
        required: true
        type: string
      request_id:
        description: Caller request id, matched in the run title
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  SOURCE_URL: https://gitlab.com/my-denia-group/Petergram.git
  SOURCE_SHA: ${{ inputs.source_sha }}
  REQUEST_ID: ${{ inputs.request_id }}
  PG_ROOT: /Users/runner/pg
  GIT_AUTHOR_NAME: petergram-ci
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: petergram-ci
  GIT_COMMITTER_EMAIL: ci@example.invalid
  PYTHONUNBUFFERED: "1"

defaults:
  run:
    shell: bash

jobs:
  # One prepare pass per run; finished stages are cached even when it runs out of
  # time, so dispatching the same commit again continues the dependency build.
  libraries:
    runs-on: macos-15
    timeout-minutes: 350
    outputs:
      key: ${{ steps.finish.outputs.key }}
    steps:
      - name: Fetch exact source from GitLab
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_sha must be 40 lowercase hex"; exit 1; }
          echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          [[ "$REQUEST_ID" =~ ^[A-Za-z0-9._-]{1,80}$ ]] || { echo "::error::bad request_id"; exit 1; }
          git init --quiet "$PG_ROOT"
          git -C "$PG_ROOT" remote add origin "$SOURCE_URL"
          git -C "$PG_ROOT" fetch --quiet --depth=1 origin "$SOURCE_SHA"
          git -C "$PG_ROOT" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$PG_ROOT" rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Bootstrap source
        run: bash "$PG_ROOT/ci/github-build/macos/steps.sh" bootstrap
      - name: Restore Libraries and ThirdParty
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.PG_ROOT }}/vendor/Libraries
            ${{ env.PG_ROOT }}/vendor/ThirdParty
          key: pg-macos15-libs-v1-none
          restore-keys: pg-macos15-libs-v1-
      - name: Prepare libraries (stops itself at job minute 300; 50 left for trim and save)
        id: prepare
        timeout-minutes: 300
        run: bash "$PG_ROOT/ci/github-build/macos/steps.sh" prepare 300
      - name: Trim and fingerprint finished stages
        id: finish
        if: always()
        env:
          PREPARE_STATUS: ${{ steps.prepare.outputs.status }}
          RESTORED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        run: bash "$PG_ROOT/ci/github-build/macos/steps.sh" finish
      - name: Save Libraries and ThirdParty
        if: always() && steps.finish.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.PG_ROOT }}/vendor/Libraries
            ${{ env.PG_ROOT }}/vendor/ThirdParty
          key: ${{ steps.finish.outputs.key }}
      - name: Require a finished dependency set
        if: always()
        env:
          PREPARE_STATUS: ${{ steps.prepare.outputs.status }}
        run: |
          if [ "$PREPARE_STATUS" != success ]; then
            echo "::error::macOS dependencies ended with status '${PREPARE_STATUS:-none}'. Finished stages are cached; after a timeout, dispatch the same commit again to continue."
            exit 1
          fi

  build:
    needs: libraries
    runs-on: macos-15
    timeout-minutes: 350
    steps:
      - name: Fetch exact source from GitLab
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_sha must be 40 lowercase hex"; exit 1; }
          echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          git init --quiet "$PG_ROOT"
          git -C "$PG_ROOT" remote add origin "$SOURCE_URL"
          git -C "$PG_ROOT" fetch --quiet --depth=1 origin "$SOURCE_SHA"
          git -C "$PG_ROOT" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$PG_ROOT" rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Bootstrap source
        run: bash "$PG_ROOT/ci/github-build/macos/steps.sh" bootstrap
      - name: Restore Libraries and ThirdParty (exact)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.PG_ROOT }}/vendor/Libraries
            ${{ env.PG_ROOT }}/vendor/ThirdParty
          key: ${{ needs.libraries.outputs.key }}
          fail-on-cache-miss: true
      - name: Prepare libraries (expected to skip every stage)
        timeout-minutes: 120
        run: bash "$PG_ROOT/ci/github-build/macos/steps.sh" prepare
      - name: Configure (overlay never compiled for macOS before)
        timeout-minutes: 60
        run: bash "$PG_ROOT/ci/github-build/macos/steps.sh" configure
      - name: Build Telegram.app
        timeout-minutes: 300
        run: bash "$PG_ROOT/ci/github-build/macos/steps.sh" build
      - name: Ad-hoc sign and zip
        id: package
        run: bash "$PG_ROOT/ci/github-build/macos/steps.sh" package
      - name: Upload unsigned app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: petergram-macos-${{ inputs.source_sha }}
          path: ${{ steps.package.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 3
